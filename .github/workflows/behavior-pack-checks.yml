name: Behavior Pack checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --input-type=module --check < scripts/main.js
      - name: Run mocked Script API runtime tests
        run: node --test tests/runtime.test.mjs
      - name: Run Behavior Pack regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build distributable Behavior Pack
        run: python3 tools/package_pack.py --output dist/InnygrEnchantments.mcpack
      - name: Upload Behavior Pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnygrEnchantments-mcpack
          path: dist/InnygrEnchantments.mcpack
          if-no-files-found: error
          retention-days: 14
