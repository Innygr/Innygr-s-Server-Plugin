name: Behavior Pack checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --input-type=module --check < scripts/main.js
      - name: Validate manifest and server-only structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          assert len(manifest.get("modules", [])) == 1
          assert manifest["modules"][0]["type"] == "script"
          assert manifest["modules"][0]["entry"] == "scripts/main.js"
          assert not Path("textures").exists()
          assert not Path("resource_pack").exists()
          print("Manifest valid; Behavior Pack remains server-side only.")
          PY
